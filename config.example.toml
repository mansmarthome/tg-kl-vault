# flowerss-bot Rust rewrite configuration.
# Keys map from the Go config.yml sample; secrets can also be supplied via env,
# for example FLOWERSS_BOT_TOKEN.

bot_token = ""
telegraph_token = []
telegraph_account = ""
telegraph_author_name = "flowerss-bot"
telegraph_author_url = ""
socks5 = ""
update_interval = 10
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/51.0.2704.103 Safari/537.36"
allowed_users = []
preview_text = 0
disable_web_page_preview = false
message_mode = "html" # "html" | "markdown"

[sqlite]
path = "./data.db"

[telegram]
endpoint = ""

[log]
level = "info"

# Sanctioned Rust-version additions.
[fetch]
concurrency = 8
retention_days = 90

# Never push an item whose publish date is older than this, no matter what the
# dedup ledger says. Without it a feed that changes its GUIDs (platform
# migration, http->https, trailing-slash change) republishes its entire archive,
# and so do items whose ledger rows aged out via retention_days above. Items
# with no date at all are always sent — they cannot be judged. Set 0 to disable.
max_item_age_days = 30

# Bookmark AI auto-tagging.
# provider = "auto" uses Gemini when api_key is set, else the local keyword
# heuristic. Set it to "gemini" or "heuristic" to force one. The heuristic
# always works offline and needs no key.
#
# daily_quota / max_rpm are CONSERVATIVE GUARDS, not official figures: Google no
# longer publishes per-model free-tier numbers (the rate-limits page redirects
# to your AI Studio quota). Check your real quota in AI Studio and adjust. The
# authoritative protection is the 429 latch in the client, and the offline
# heuristic is the final, never-failing fallback.
#
# The API key can also come from env: FLOWERSS_BOOKMARK_AI_API_KEY, or a bare
# GEMINI_API_KEY. Every field has a FLOWERSS_BOOKMARK_AI_* env override.
[bookmark.ai]
provider    = "auto"                  # "auto" | "gemini" | "heuristic" | "mcp"
api_key     = ""
model       = "gemini-3.1-flash-lite"
endpoint    = "https://generativelanguage.googleapis.com"
daily_quota = 200                     # conservative soft guard, not official
max_rpm     = 10                      # conservative soft guard, not official
max_tags    = 3
page_size   = 5

# Remote-agent backend over MCP (pi-mcp-bridge). Used when provider = "mcp"
# (tagging) and, whenever configured, for the on-demand 📝 article-summary
# button under pushed items. The bridge drives a real coding agent on your
# machine, so `token` is a shell-grade credential — keep it behind a tunnel +
# ACL. Calls use the async job tools (pi_run_async + pi_result polling), which
# tolerate long agent turns and the ~100s Cloudflare-free proxy timeout.
# Env overrides: FLOWERSS_BOOKMARK_AI_MCP_ENDPOINT / _TOKEN /
# _CF_ACCESS_CLIENT_ID / _CF_ACCESS_CLIENT_SECRET / _TIMEOUT_SECONDS /
# _POLL_INTERVAL_MS.
[bookmark.ai.mcp]
endpoint                = ""          # e.g. https://pi-mcp.example.com/mcp
token                   = ""          # Bearer token (openssl rand -hex 32)
cf_access_client_id     = ""          # optional Cloudflare Access service token
cf_access_client_secret = ""
timeout_seconds         = 240
poll_interval_ms        = 1500

# Stock tracking (台股 TWSE/TPEx + US). Manage a per-chat watchlist, query
# quotes + technical indicators, and push a close-of-day report per market.
# Every field has a FLOWERSS_STOCK_* env override.
#
# The market clock (which day is a trading day, when the bell rings) is read
# entirely from Yahoo's per-response session data, so there is no timezone
# database and no hard-coded holiday calendar to maintain.
#
# IMPORTANT (Turso): the close-report dedup is per-instance plus a DB ledger.
# Under TURSO_DATABASE_URL the embedded replica reads can lag ~60s, so run only
# ONE instance or two may each send the daily report inside that sync window.
[stock]
enabled                  = true
poll_seconds             = 60         # worker tick; a pass with no due chat is free
history_days             = 180        # bars fetched for indicators
cache_ttl_seconds        = 60
max_symbols_per_chat     = 50
max_symbols_global       = 300        # distinct symbols across all chats
watchlist_page_size      = 8
default_delay_minutes_tw = 60         # push this long after the TW close if no explicit time
default_delay_minutes_us = 90
late_threshold_minutes   = 30         # a report later than this is flagged "delayed"
tw_probe_symbol          = "2330.TW"  # probed every pass so market state never needs a watchlist
us_probe_symbol          = "AAPL"
yahoo_endpoint           = "https://query1.finance.yahoo.com"
twse_endpoint            = "https://openapi.twse.com.tw/v1"
tpex_endpoint            = "https://www.tpex.org.tw/openapi/v1"

# AI commentary reuses the [bookmark.ai.mcp] bridge above — no separate
# credentials. It is off by default; the numbers always render without it. The
# daily quota is metered separately from bookmark tagging so a chatty watchlist
# can't exhaust the tagging budget (and vice versa).
ai_commentary            = false
ai_daily_quota           = 20         # MCP calls/day for stock commentary
ai_max_symbols           = 3          # symbols per batch prompt (not calls)
ai_report_timeout_seconds = 90        # < mcp.timeout_seconds so a slow turn can't stall the tick

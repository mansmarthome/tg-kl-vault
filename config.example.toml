# flowerss-bot Rust rewrite configuration.
# Keys map from the Go config.yml sample; secrets can also be supplied via env,
# for example FLOWERSS_BOT_TOKEN.

bot_token = ""
telegraph_token = []
telegraph_account = ""
telegraph_author_name = "flowerss-bot"
telegraph_author_url = ""
socks5 = ""
update_interval = 10
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/51.0.2704.103 Safari/537.36"
allowed_users = []
disable_web_page_preview = false

[sqlite]
path = "./data.db"

[telegram]
# Custom Telegram Bot API base URL, e.g. "http://telegram-bot-api:8081".
# Leave empty to use the official https://api.telegram.org.
endpoint = ""
# Connection mode: "polling" (default) or "broadcast".
#   polling   - long-poll getUpdates + command/callback dispatcher + outbound sends.
#   broadcast - outbound sends only; no getUpdates, no commands, no buttons.
#               Use this for steady-state operation behind a self-hosted Bot API.
#               Switch back to "polling" to manage subscriptions.
mode = "polling"

[log]
level = "info"

# Sanctioned Rust-version additions.
[fetch]
concurrency = 8
retention_days = 90

services:
  flowerss:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      FLOWERSS_BOT_TOKEN: ${FLOWERSS_BOT_TOKEN:?set FLOWERSS_BOT_TOKEN}
      FLOWERSS_SQLITE_PATH: ${FLOWERSS_SQLITE_PATH:-/app/data/data.db}
      FLOWERSS_LOG_LEVEL: ${FLOWERSS_LOG_LEVEL:-info}
      FLOWERSS_UPDATE_INTERVAL: ${FLOWERSS_UPDATE_INTERVAL:-10}
      FLOWERSS_FETCH_CONCURRENCY: ${FLOWERSS_FETCH_CONCURRENCY:-8}
      FLOWERSS_FETCH_RETENTION_DAYS: ${FLOWERSS_FETCH_RETENTION_DAYS:-90}
      FLOWERSS_MESSAGE_MODE: ${FLOWERSS_MESSAGE_MODE:-html}
      FLOWERSS_DISABLE_WEB_PAGE_PREVIEW: ${FLOWERSS_DISABLE_WEB_PAGE_PREVIEW:-false}
      FLOWERSS_PREVIEW_TEXT: ${FLOWERSS_PREVIEW_TEXT:-0}
      FLOWERSS_ALLOWED_USERS: ${FLOWERSS_ALLOWED_USERS:-}
      FLOWERSS_TELEGRAPH_TOKEN: ${FLOWERSS_TELEGRAPH_TOKEN:-}
      FLOWERSS_TELEGRAPH_AUTHOR_NAME: ${FLOWERSS_TELEGRAPH_AUTHOR_NAME:-flowerss-bot}
      FLOWERSS_TELEGRAPH_AUTHOR_URL: ${FLOWERSS_TELEGRAPH_AUTHOR_URL:-}
      FLOWERSS_SOCKS5: ${FLOWERSS_SOCKS5:-}
      FLOWERSS_TELEGRAM_ENDPOINT: ${FLOWERSS_TELEGRAM_ENDPOINT:-}

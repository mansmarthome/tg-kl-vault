[package]
name = "flowerss-bot"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
feed-rs = "2.4.0"
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.33"
quick-xml = { version = "0.41.0", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["socks", "gzip", "brotli", "rustls-tls", "stream", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
telegraph = { path = "../telegraph" }
url.workspace = true
libsql = { version = "0.9", features = ["remote"] }

[dev-dependencies]
tempfile = "3.27.0"
